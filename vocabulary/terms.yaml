schema: rcp.vocabulary/v1
# 平台立名词汇表。新概念先在此立名，再进契约与实现；同一概念禁止多套叫法。
#
# covers：该术语覆盖的 TBox 种类（kind）。**仅作人造对照，当前没有检查器读它**
# ——原 W303（种类未立名）已随 SHACL 迁移裁掉，种类定义由 concepts/tbox.ttl 唯一承载。
# 保留 covers 是为了让"业务叫法 → 种类"的映射在文档里有落点；不要指望它报错。
terms:
  - term: patrol_event
    zh: 巡查事件
    definition: 进入平台统一巡查入口的一次业务事实，以 event_id + version 唯一标识。
    owner: platform

  - term: api_gateway
    zh: 网关
    definition: 平台对外唯一 HTTP 入口，负责幂等判定、路由、分级处置与巡查线降级。
    owner: platform
    covers: [gateway]

  - term: patrol_line
    zh: 巡查线
    definition: 按业务域切分的风控判定单元，四条线为 content / message / account / fund。
    owner: platform
    covers: [patrol-line]

  - term: patrol_verdict
    zh: 巡查结论
    definition: 单条巡查线对事件给出的统一结论，含决策、风险分、原因与明细。
    owner: rcp-core

  - term: decision
    zh: 决策
    definition: 处置等级枚举，取值唯一来自 rcp-core 的 Decision，禁止各服务私造同名枚举。
    owner: rcp-core

  - term: disposition
    zh: 分级处置
    definition: 由网关按决策等级映射出的执行动作（放行/提示/限流/加审/拦截/封禁）。
    owner: api-gateway

  - term: domain
    zh: 巡查域
    definition: 事件所属巡查线的标识，取值 content / message / account / fund。
    owner: platform

  - term: idempotency_key
    zh: 幂等键
    definition: event_id + version 组合；同键重放不再产生新裁决，旧版本回放被拒绝。
    owner: api-gateway

  - term: dataway
    zh: 数据网关
    definition: 业务服务访问数据库的唯一出口，只接受声明式查询与模板化写入，拒绝裸 SQL。
    owner: rcp-dataway
    covers: [data-gateway]

  - term: schema_migration
    zh: 表结构迁移
    definition: 版本化的 DDL 变更单元，只能由 db-ops 执行，业务仓不得自带 DDL。
    owner: rcp-db-ops
    covers: [db-ops]

  - term: ops_console
    zh: 运营控制台
    definition: 面向风控运营的只读界面，只经 api-gateway 取数，不直连任何后端服务。
    owner: platform
    covers: [frontend]

  - term: meta_repo
    zh: 元仓
    definition: >-
      不参与运行时数据面的仓：契约声明、本体检查工具、迁移与部署清单。
      无端口、不部署、不挂 OpenAPI，但必须有 owner 与登记。
    owner: platform
    covers: [meta]
