openapi: 3.0.3
info:
  title: Risk Control Platform · Content Patrol
  version: 1.0.0
  description: 内容巡查线。SimHash + 3-gram + 抽屉原理分段索引的近重复检测，只被网关调用。
servers:
  - url: http://localhost:8081
paths:
  /api/v1/patrol/check:
    post:
      operationId: checkJobPost
      summary: 岗位内容判重
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city, trade, title, body]
              properties:
                eventId:
                  type: string
                jobId:
                  type: integer
                  format: int64
                city:
                  type: string
                trade:
                  type: string
                title:
                  type: string
                body:
                  type: string
                ts:
                  type: integer
                  format: int64
      responses:
        '200':
          description: 巡查结论
          content:
            application/json:
              schema:
                $ref: ../schemas/patrol-verdict.yaml
        '400':
          description: 必填字段缺失
  /api/v1/patrol/shard:
    get:
      operationId: shardStats
      summary: 分片观测（桶倾斜监控）
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
        - name: trade
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 分片键与当前桶大小
          content:
            application/json:
              schema:
                type: object
                properties:
                  shard:
                    type: string
                  size:
                    type: integer
