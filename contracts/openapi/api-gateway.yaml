openapi: 3.0.3
info:
  title: Risk Control Platform · API Gateway
  version: 2.0.0
  description: |
    平台唯一对外入口。前端不得绕过本网关直连任何后端服务。

    鉴权：
      - 除 /api/v1/iam/**（由 IAM 自行校验）外，所有 /api/v1/** 需要
        `Authorization: Bearer <token>`。
      - 令牌有效性由网关调用 IAM 的 /api/v1/iam/introspect 判定；IAM 不可用时
        一律拒绝（fail closed），不放行未鉴权请求。
      - /api/v1/iam/** 是透传路由，请求语义以 contracts/openapi/iam.yaml 为准；
        rcp-iam（Go + Gin 实现）是平台唯一的身份与权限判定点。

    2.0.0 起移除巡查事件入口（/api/v1/patrol/*）与决策处置语义，
    平台转向统一 API 网关方向；新增上游转发契约另行升版。
servers:
  - url: http://localhost:8080
tags:
  - name: iam
    description: 透传到 rcp-iam，鉴权由 IAM 自行完成
paths:
  /api/v1/iam/**:
    get:
      operationId: proxyIamGet
      summary: 透传 GET 到 IAM
      tags: [iam]
      description: |
        路径、查询串、请求体与 Authorization 头原样转发到 rcp-iam（服务发现按名解析）。
        响应状态码与响应体原样返回，网关不改写 IAM 的错误语义。
      security: []
      responses:
        '200':
          description: IAM 原始响应
    post:
      operationId: proxyIamPost
      summary: 透传 POST 到 IAM
      tags: [iam]
      security: []
      responses:
        '200':
          description: IAM 原始响应（含 201/204 等由 IAM 决定）
    put:
      operationId: proxyIamPut
      summary: 透传 PUT 到 IAM
      tags: [iam]
      security: []
      responses:
        '200':
          description: IAM 原始响应
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 不透明令牌，由 IAM 的 /api/v1/iam/login 签发。
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: INVALID_TOKEN
        message:
          type: string
security:
  - bearerAuth: []
