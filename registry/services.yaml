schema: rcp.registry/v1
platform: risk-control-platform
updated: 2026-11-01

# 平台基座版本真源：服务侧必须对齐，禁止各仓自行抬版本。
# 消费方式（工作区根目录）：grep -A6 '^baseline_stack:' rcp-contracts/registry/services.yaml
baseline_stack:
  java: "17"
  spring_boot: "3.3.5"
  maven_surefire: "3.2.5"

# 服务发现：消费方按服务名解析地址，不在部署清单里写死上游 URL（见 RL-007）。
# state 取值：
#   declared —— 形态已声明、基础设施清单已就位，Java 侧尚未引入 discovery 依赖
#   wired    —— 服务已引入依赖并按 name 解析，清单中不再出现上游地址
discovery:
  kind: nacos
  state: declared
  server: ${NACOS_SERVER:nacos:8848}
  namespace: risk-control
  group: DEFAULT_GROUP
  fallback: k8s-dns
  note: >-
    当前路由地址仍由环境变量给出（RL-007 例外已登记在 ontology/constraints/redlines.yaml），
    未接注册中心是本平台唯一的硬偏离，见 docs/DISCOVERY.md。

# 库（非 HTTP 服务）：只被依赖，不登记端口。
libraries:
  - name: rcp-core
    repo: rcp-core
    artifact: com.risk.platform:rcp-core:1.0.0
    owner: platform
    capabilities:
      - decision.model
      - patrol.pipeline
      - rule.engine

# HTTP 服务：名称即服务发现标识，端口即本地默认端口。
# external: true 表示允许被工作区外部直接访问；其余服务只允许集群内互调。
services:
  - name: api-gateway
    repo: rcp-api-gateway
    kind: gateway
    port: 8080
    external: true
    owner: platform
    capabilities:
      - patrol.dispatch
      - patrol.domains
    depends_on:
      - content-patrol
      - message-patrol
      - account-patrol
      - fund-patrol
    health: /actuator/health
    contracts:
      - contracts/openapi/api-gateway.yaml

  - name: content-patrol
    repo: rcp-content-patrol
    kind: patrol-line
    port: 8081
    external: false
    owner: risk-content
    capabilities:
      - patrol.content.dedup
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/content-patrol.yaml

  - name: message-patrol
    repo: rcp-message-patrol
    kind: patrol-line
    port: 8082
    external: false
    owner: risk-message
    capabilities:
      - patrol.message.ac
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/message-patrol.yaml

  - name: account-patrol
    repo: rcp-account-patrol
    kind: patrol-line
    port: 8083
    external: false
    owner: risk-account
    capabilities:
      - patrol.account.rule
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/account-patrol.yaml

  - name: fund-patrol
    repo: rcp-fund-patrol
    kind: patrol-line
    port: 8084
    external: false
    owner: risk-fund
    capabilities:
      - patrol.fund.rule
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/fund-patrol.yaml

  - name: dataway
    repo: rcp-dataway
    kind: data-gateway
    port: 8090
    external: false
    owner: platform
    capabilities:
      - data.query
      - data.execute
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/dataway.yaml

  - name: db-ops
    repo: rcp-db-ops
    kind: db-ops
    port: 8091
    external: false
    owner: platform
    capabilities:
      - schema.migrate
      - schema.version
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/db-ops.yaml

  - name: web
    repo: rcp-web
    kind: frontend
    port: 5173
    external: true
    owner: platform
    capabilities:
      - ops.console
    depends_on:
      - api-gateway
    health: /
    contracts: []
