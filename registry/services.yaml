schema: rcp.registry/v1
platform: risk-control-platform
updated: 2026-11-01

# 平台基座版本真源：服务侧必须对齐，禁止各仓自行抬版本。
# 消费方式（工作区根目录）：grep -A6 '^baseline_stack:' rcp-contracts/registry/services.yaml
baseline_stack:
  java: "17"
  spring_boot: "3.3.5"
  # Spring Cloud 与 Spring Cloud Alibaba 的兼容组合经容器内 Maven 构建验证：
  # Boot 3.3.x -> Spring Cloud 2023.0.x (Leyton) -> SCA 2023.0.3.x（nacos-client 2.4.x，
  # 配 Nacos Server v2.3.2）。禁止各仓自行抬版本。
  spring_cloud: "2023.0.3"
  spring_cloud_alibaba: "2023.0.3.4"
  maven_surefire: "3.2.5"

# 服务发现：消费方按服务名解析地址，不在部署清单里写死上游 URL（见 RL-007）。
# state 取值：
#   declared —— 形态已声明、基础设施清单已就位，Java 侧尚未引入 discovery 依赖
#   wired    —— 服务已引入依赖并按 name 解析，清单中不再出现上游地址
discovery:
  kind: nacos
  state: wired
  server: ${NACOS_SERVER:nacos:8848}
  namespace: risk-control
  group: DEFAULT_GROUP
  fallback: k8s-dns
  note: >-
    接线已完成：7 个 Java 服务引入 nacos-discovery 依赖并按占位符注册，
    网关经 DiscoveryClient 按服务名解析（多实例轮转），endpoints 仅作兜底；
    清单中不再出现上游地址（RL-007 例外已随收尾删除）。本平台为 demo 定位，
    未做运行时标定，行为验证以 mvn test 与寻址单测为准，见 docs/DISCOVERY.md。

# 库（非 HTTP 服务）：只被依赖，不登记端口。
libraries:
  - name: rcp-core
    repo: rcp-core
    artifact: com.risk.platform:rcp-core:1.0.0
    owner: platform
    capabilities:
      - decision.model
      - patrol.pipeline
      - rule.engine

# HTTP 服务：名称即服务发现标识，端口即本地默认端口。
# external: true 表示允许被工作区外部直接访问；其余服务只允许集群内互调。
#
# expected（可选）：声明本服务"当前图位置"是有意状态，用于区分"有意无下游"与
# "漏登记依赖方"（E109/E110 是启发式，分不清二者）。声明了任一真值标志就必须给
# reason/owner/review_by，review_by 过期后恢复告警：
#   no_dependents: true  预期入度为 0（有意暂无下游，消 E109）
#   unreachable:   true  预期从任何对外入口不可达（有意暂未接入数据面，消 E110）
services:
  - name: api-gateway
    repo: rcp-api-gateway
    kind: gateway
    port: 8080
    external: true
    owner: platform
    capabilities:
      - patrol.dispatch
      - patrol.domains
    depends_on:
      - content-patrol
      - message-patrol
      - account-patrol
      - fund-patrol
    health: /actuator/health
    contracts:
      - contracts/openapi/api-gateway.yaml

  - name: content-patrol
    repo: rcp-content-patrol
    kind: patrol-line
    port: 8081
    external: false
    owner: risk-content
    capabilities:
      - patrol.content.dedup
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/content-patrol.yaml

  - name: message-patrol
    repo: rcp-message-patrol
    kind: patrol-line
    port: 8082
    external: false
    owner: risk-message
    capabilities:
      - patrol.message.ac
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/message-patrol.yaml

  - name: account-patrol
    repo: rcp-account-patrol
    kind: patrol-line
    port: 8083
    external: false
    owner: risk-account
    capabilities:
      - patrol.account.rule
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/account-patrol.yaml

  - name: fund-patrol
    repo: rcp-fund-patrol
    kind: patrol-line
    port: 8084
    external: false
    owner: risk-fund
    capabilities:
      - patrol.fund.rule
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/fund-patrol.yaml

  - name: dataway
    repo: rcp-dataway
    kind: data-gateway
    port: 8090
    external: false
    owner: platform
    capabilities:
      - data.query
      - data.execute
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/dataway.yaml
    # 数据面尚未启用：巡查线尚未接 data.query/data.execute，故当前无下游、不可达。
    expected:
      no_dependents: true
      unreachable: true
      reason: 数据面尚未启用；待 discovery 接入后由 api-gateway 挂依赖
      owner: platform
      review_by: 2027-03-31

  - name: db-ops
    repo: rcp-db-ops
    kind: db-ops
    port: 8091
    external: false
    owner: platform
    capabilities:
      - schema.migrate
      - schema.version
    depends_on: []
    health: /actuator/health
    contracts:
      - contracts/openapi/db-ops.yaml
    # 迁移执行器暂由平台侧手动/脚本调用，尚未有运行时服务依赖它，故当前无下游、不可达。
    expected:
      no_dependents: true
      unreachable: true
      reason: 迁移执行器暂由平台侧手动调用；待接入后由 data-gateway/ops 流程挂依赖
      owner: platform
      review_by: 2027-03-31

  - name: web
    repo: rcp-web
    kind: frontend
    port: 5173
    external: true
    owner: platform
    capabilities:
      - ops.console
    depends_on:
      - api-gateway
    health: /
    contracts: []

  # 元仓（kind=meta）：不参与运行时数据面，无端口、不部署、不挂 OpenAPI。
  # 登记它们的目的不是"当服务用"，而是让 owner 与仓边界有唯一出处——
  # 否则 rcp-ops 这类承担迁移真源的仓在平台登记里没有户头，E107 也无法区分
  # "有意游离"与"漏登记"。
  - name: contracts
    repo: rcp-contracts
    kind: meta
    external: false
    owner: platform
    capabilities: []
    depends_on: []
    contracts: []

  - name: ontology
    repo: rcp-ontology
    kind: meta
    external: false
    owner: platform
    capabilities: []
    depends_on: []
    contracts: []

  - name: ops
    repo: rcp-ops
    kind: meta
    external: false
    owner: platform
    capabilities: []
    depends_on: []
    contracts: []
