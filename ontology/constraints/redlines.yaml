schema: rcp.constraints/v1
# 架构红线：可机械检查的硬约束。由 rcp-ontology 的 check 校验，违反即红。
#
# spec：机器可读的检查规格（policy-as-code）。type 决定执行器，其余字段是执行参数：
#   registry-assert  登记断言，判定由 kinds.yaml 属性承载（via 指明属性）
#   cross-source     跨源逐字比对（决策枚举、分值等）
#   file-scan        文件系统扫描（RL-004：DDL 落位）
#   registry-scan    按登记遍历仓并抽取依赖（RL-005：JDBC 引入）
#   upstream-scan    部署清单上游地址扫描（RL-007：写死内部地址 + 例外复审）
# spec 合法性由 rcp-ontology 的 E302 校验；缺 spec 报 E301（纸面红线）。
# message 是命中时的报告模板（{rel}/{matched}/{url} 等为占位）；改参数只需改本文件，无需改 Python。
constraints:
  - id: RL-001
    name: patrol-line-no-cross-call
    zh: 巡查线之间不得互相调用
    rationale: 巡查线必须可独立部署、独立降级；互调会造成级联降级与责任不清。
    check: registry
    rule: |
      kind=patrol-line 的服务，其 depends_on 中不得出现任何 kind=patrol-line 的服务。
    spec:
      type: registry-assert
      via: kinds.allowed_depends_on_kinds

  - id: RL-002
    name: external-entry-is-gateway
    zh: 对外入口唯一
    rationale: 边缘只暴露网关与前端；服务端口直接对外会绕过幂等、状态机与分级处置。
    check: registry
    rule: |
      external=true 的服务只允许 kind in [gateway, frontend]；其余服务必须 external=false。
    spec:
      type: registry-assert
      via: kinds.must_be_external

  - id: RL-003
    name: decision-single-source
    zh: 决策语义唯一来源
    rationale: 四条线各自发明决策等级会导致处置层无法分级，风险分不可比。
    check: contract
    rule: |
      contracts/schemas/decision.yaml 的取值集合必须与 rcp-core 的 Decision 枚举完全一致；
      其他服务的 OpenAPI 只能 $ref 该 schema，不得内联枚举。
    spec:
      type: cross-source
      sources:
        - path: contracts/schemas/decision.yaml
          field: enum
        - path: concepts/decisions.yaml
          list: enum
          key: code
      assert: identical
      fields:
        - a: x-base-score
          b: base_score
          assert: equal

  - id: RL-004
    name: ddl-only-via-dbops
    zh: DDL 只能经 db-ops
    rationale: 表结构变更需版本化、可回滚、可审计；散落在业务仓里无法保证顺序与恢复。
    check: repo-layout
    rule: |
      除 rcp-ops/migrations 外，任何仓不得包含 *.sql 的建表/改表语句。
    spec:
      type: file-scan
      include: ["*.sql"]
      allow_prefixes: ["rcp-ops/migrations/", "migrations/"]
      match: '\b(?:create|alter|drop|truncate)\s+(?:table|index|view|database|schema|unique\s+index)\b'
      case_insensitive: true
      message: '{rel} 含 DDL「{matched}」；建表/改表只允许经 db-ops 执行 {allowed} 下的迁移'

  - id: RL-005
    name: business-data-only-via-dataway
    zh: 业务读写只能经 dataway
    rationale: 直连数据库会让连接、权限、审计与限流全部失效。
    check: repo-layout
    rule: |
      业务服务仓的 pom 不得引入 JDBC 驱动依赖；数据访问只能通过 dataway 的 HTTP 契约。
    spec:
      type: registry-scan
      include: ["pom.xml"]
      extract: dependency.groupId
      deny_values: [mysql, com.mysql, com.mysql.jdbc, org.postgresql, com.h2database, com.oracle.database.jdbc, org.mariadb.jdbc]
      allow_kinds: [data-gateway, db-ops]
      message: '{repo}（{name}）的 pom 引入 JDBC 驱动 {group}:{artifact}；业务读写只能经 dataway 的 HTTP 契约'

  - id: RL-006
    name: service-must-register
    zh: 服务必须登记并挂契约
    rationale: 未登记的服务等于绕过契约先行，消费侧无法对表。
    check: registry
    rule: |
      services 中每个服务必须有非空 contracts（frontend 除外），且契约文件在仓内存在。
    spec:
      type: registry-assert
      via: kinds.requires_contract

  - id: RL-007
    name: no-hardcoded-upstream
    zh: 上游地址不得写死
    rationale: >-
      部署清单写死服务地址后，扩缩容、灰度、故障转移都要改配置并重发；
      消费方也无法在未知上游存在时被自动发现。
    check: repo-layout
    rule: |
      rcp-ops 下的 compose 与 K8s 清单不得出现指向 internal 服务
      （registry 中 external=false）的 http(s)://<服务名>:<端口> 地址。
      无法立即消除时须在下方 exceptions 登记，并给出 review_by 复审日期。
    spec:
      type: upstream-scan
      scan_prefix: rcp-ops/
      include: ["*.yml", "*.yaml"]
      match: 'https?://([a-z][a-z0-9-]*):(\d{2,5})'
      internal_hosts:
        from: registry
        where: external == false
      exceptions: review_by
      message: '{rel}:{lineno} 写死上游 {url}；应经服务发现解析，或在 redlines.yaml 登记例外'
      message_expired: '{rel}:{lineno} 写死上游 {url}；登记的例外已于 {review_by} 过期，须复审'
      message_excepted: '{rel} {span}写死内部服务地址（例外：{reason}；owner={owner}，复审 {review_by}）'

# 例外登记：无法立即消除的偏离。必须同时给出 scope（glob）、match（正则）、
# reason、owner、review_by —— 缺一项视为未登记。
# 检查器命中即降级为 warn；review_by 过期后自动恢复为 error。
# 当前无例外：服务发现已接线（见 docs/DISCOVERY.md），RL-007 的 12 处
# 写死地址已随收尾从 rcp-ops 清单中删除。
exceptions: []
